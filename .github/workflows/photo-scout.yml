name: Photo scout

# Only on the photos-scout branch: downloads candidate photos for review and commits them there.
on:
  push:
    branches: [photos-scout]
    paths: ["tools/photo_scout.py", ".github/workflows/photo-scout.yml"]

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/photo_scout.py
      - name: Commit the candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scout
          git commit -m "Photo candidates from Wikimedia Commons" || echo "nothing new"
          git push
