name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "PlanB-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: planb-${{ github.run_number }}
          path: PlanB-${{ github.run_number }}.apk
          if-no-files-found: error

      # A release gives a direct download: Releases → latest → PlanB-N.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "build-${{ github.run_number }}" "PlanB-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" \
            --title "Plan B build ${{ github.run_number }}" \
            --notes "${NOTES:-Manual build}" \
            --latest
